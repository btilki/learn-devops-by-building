schema_version: 1
kind: infrastructure-versions
id: northwind-infrastructure-versions
versions:
  - capability: tenant-storage
    version: "1.0"
    tenant_parameters: [class, size-gb]
    hidden_module: [terraform-resource-address, provider-project]
  - capability: tenant-storage
    version: "2.0"
    tenant_parameters: [sku, size-gb]
    hidden_module: [terraform-resource-address, provider-project]
  - capability: workload-identity
    version: "1.0"
    credential_model: short-lived-federated
    tenant_parameters: [subject]
    hidden_module: [oidc-provider-thumbprint, iam-role-arn]
  - capability: tenant-network
    version: "1.0"
    tenant_parameters: [isolation]
    hidden_module: [cni-plugin-config, security-group-id]
  - capability: artifact-promotion
    version: "1.0"
    tenant_parameters: [artifact-digest]
    hidden_module: [registry-credentials, helm-release-name]
