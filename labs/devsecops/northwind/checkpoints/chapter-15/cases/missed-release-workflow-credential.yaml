schema_version: 1
kind: automation-credential-rotation
old_subject: release-workflow
replacement_subject:
  id: release-workflow-v2
  type: automation
  issuer: northwind-oidc
  audiences: [northwind-registry]
  roles: [artifact-publisher]
  status: active
claims:
  old:
    claim_id: recovery-old-release-workflow
    issuer: northwind-oidc
    audience: northwind-registry
    lifetime_seconds: 600
  replacement:
    claim_id: recovery-new-release-workflow
    issuer: northwind-oidc
    audience: northwind-registry
    lifetime_seconds: 600
