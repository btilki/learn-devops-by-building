schema_version: 1
kind: regional-constraints
id: northwind-regional-constraints
isolation:
  tenants: [storefront, fulfillment]
  survives_failover: true
provider_regionality:
  - provider: payment
    constraint: region-scoped
  - provider: warehouse
    constraint: region-scoped
no_silent_cross_region:
  - tenant-order-state
  - warehouse-dispatch-state
insufficient_restores:
  - devops-one-environment-reconstruction
  - platform-plane-restore
insufficient_identities:
  - "1.0"
  - tenant-storage-1.0
limitations_consumed:
  - not-regional-loss
  - not-portfolio-rto
